@if (isLoggedIn()) {
  <div class="d-flex" style="height:100vh;">
    <div class="d-flex" style="height:100vh; width: 100%;">
      <app-sidebar
        [title]="'Cockpit - Green Mower'"
        [logo]="'logo.png'"
        [items]="items()"
        [actions]="actions()"
        [user]="userVm()"
        [collapsed]="isCollapsed()"
        (collapseChange)="onSidebarCollapsed($event)"
        (itemClick)="onSideItem($event)"
        (action)="onTopAction($event)"
        (signOut)="onLogout()">
      </app-sidebar>

      <div class="flex-grow-1 d-flex flex-column">
        <main class="p-3 overflow-auto">
          @if (rt.offlineBannerVisible()) {
            <div class="alert alert-danger d-flex align-items-center gap-2" role="alert">
              <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
              <div>Backend disconnected. Actions disabled until reconnect.</div>
            </div>
          }
          <router-outlet />
        </main>
        <!-- Statusbar: double-click opens config viewer -->
        <app-statusbar (dblclick)="onStatusbarDblClick()" />
        <!-- Modals -->
        <app-config-dialog #cfgDlg></app-config-dialog>
        <app-import-dialog #importDlg></app-import-dialog>
      </div>
    </div>
  </div>
} @else {
  <div class="d-flex flex-column align-items-center justify-content-center" style="height:100vh;">
    <h1 class="mb-3">Cockpit - Green Mower</h1>
    <div class="w-100" style="max-width:480px;">
      <router-outlet/>
    </div>
  </div>
}
