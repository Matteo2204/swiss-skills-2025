<div class="container p-0">
  <!-- Overview header (sticky to cockpit area) -->
  <app-overview-header />

  <div class="px-3 py-3">
  <div class="d-flex align-items-center gap-3 mb-3">
    <app-device-selector></app-device-selector>
    <div class="text-muted" aria-live="polite">
      @if (!ds.hasSelection()) {
        No device selected
      } @else {
        Selected: <strong>#{{ ds.selected()!.id }}</strong>
      }
    </div>
    <div class="ms-auto">
      <button class="btn btn-outline-secondary btn-sm" (click)="logout()">Logout</button>
    </div>
  </div>

  <!-- Quick actions removed: use the Remote Control page -->

  <!-- Tabs: Map | Battery | Status -->
  <ul class="nav nav-tabs mt-3" role="tablist">
    <li class="nav-item" role="presentation">
      <button type="button" class="nav-link" [class.active]="tab() === 'map'" (click)="tab.set('map')" role="tab" [attr.aria-selected]="tab() === 'map'">Map</button>
    </li>
    <li class="nav-item" role="presentation">
      <button type="button" class="nav-link" [class.active]="tab() === 'battery'" (click)="tab.set('battery')" role="tab" [attr.aria-selected]="tab() === 'battery'">Battery</button>
    </li>
    <li class="nav-item" role="presentation">
      <button type="button" class="nav-link" [class.active]="tab() === 'status'" (click)="tab.set('status')" role="tab" [attr.aria-selected]="tab() === 'status'">Status</button>
    </li>
  </ul>

  <div class="tab-content pt-3">
    @if (tab() === 'map') {
      <div class="tab-pane fade show active" role="tabpanel">
        <app-gps-map />
      </div>
    }
    @if (tab() === 'battery') {
      <div class="tab-pane fade show active" role="tabpanel">
        <app-battery-trend />
      </div>
    }
    @if (tab() === 'status') {
      <div class="tab-pane fade show active" role="tabpanel">
        <app-state-analytics />
      </div>
    }
  </div>
  
  </div>
</div>
