<dialog #dlg class="export-dialog">
  <form method="dialog" class="content" (submit)="$event.preventDefault()">
    <h3>Export Data</h3>

    <div class="mode-toggle">
      <label>
        <input type="radio" name="mode" [checked]="isCurrent()" (change)="onToggleMode('current')"> Current only
      </label>
      <label>
        <input type="radio" name="mode" [checked]="!isCurrent()" (change)="onToggleMode('history')"> History
      </label>
    </div>

    <div class="range" *ngIf="!isCurrent()">
      <label>From
        <input type="datetime-local" [value]="fromInput()" (change)="fromInput.set(($any($event.target)).value)">
      </label>
      <label>To
        <input type="datetime-local" [value]="toInput()" (change)="toInput.set(($any($event.target)).value)">
      </label>
      <small class="hint">Default: last {{DEFAULT_HISTORY_RANGE_H}} hours.</small>
    </div>

    <div class="error" *ngIf="error()">{{ error() }}</div>

    <div class="actions">
      <button type="button" (click)="onClose()" [disabled]="busy()">Cancel</button>
      <button type="button" class="primary" (click)="onExport()" [disabled]="!canExport()">
        <span *ngIf="!busy()">Export</span>
        <span *ngIf="busy()">Exporting…</span>
      </button>
    </div>
  </form>
</dialog>
