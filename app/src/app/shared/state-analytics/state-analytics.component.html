<div class="card">
  <div class="card-header d-flex align-items-center gap-2 flex-wrap">
    <div class="fw-semibold">Distribuzione stato + Timeline</div>
    <div class="ms-auto d-flex align-items-center gap-2 flex-wrap">
      <label class="form-label m-0 small" for="fromInput">Da</label>
      <input id="fromInput" class="form-control form-control-sm" type="datetime-local" [value]="fromInput()" (change)="fromInput.set(($any($event.target)).value)" />
      <label class="form-label m-0 small" for="toInput">A</label>
      <input id="toInput" class="form-control form-control-sm" type="datetime-local" [value]="toInput()" (change)="toInput.set(($any($event.target)).value)" />
      <button class="btn btn-sm btn-outline-primary" (click)="reload()" [disabled]="isLoading() || !fromInput() || !toInput()">
        @if (isLoading()) { <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span> }
        Ricarica
      </button>
    </div>
  </div>
  <div class="card-body">
    @if (error() === '404' || !hasData()) {
      <div class="text-muted" role="status">Nessuna misura nel periodo</div>
    } @else {
      <!-- Distribution chart (SVG inline, horizontal bars) -->
      <div class="mb-3">
        <svg [attr.width]="svgBars().width" [attr.height]="svgBars().height" role="img" aria-label="Distribuzione percentuale per stato">
          <g *ngFor="let b of svgBars().bars; trackBy: trackByIdx">
            <!-- Label area on the left -->
            <text [attr.x]="padding.left - 8" [attr.y]="b.y + b.h/2 + 4" text-anchor="end" class="tick">{{ b.stateName }}</text>
            <!-- Bar -->
            <rect [attr.x]="b.x" [attr.y]="b.y" [attr.width]="b.w" [attr.height]="b.h" [attr.fill]="b.color" rx="3" ry="3" />
            <!-- Percent label (outside if bar too short) -->
            <text [attr.x]="(b.w > 48 ? (b.x + b.w - 6) : (b.x + b.w + 6))" [attr.y]="b.y + b.h/2 + 4"
                  [attr.text-anchor]="b.w > 48 ? 'end' : 'start'" [class.inside]="b.w > 48">
              {{ b.pct.toFixed(1) }}%
            </text>
          </g>
          <!-- X-axis ticks at 0,25,50,75,100% -->
          <g aria-hidden="true">
            <line *ngFor="let p of [0,25,50,75,100]" [attr.x1]="padding.left + (svgBars().innerW * p / 100)"
                  [attr.x2]="padding.left + (svgBars().innerW * p / 100)" [attr.y1]="0" [attr.y2]="svgBars().height"
                  class="grid" />
            <text *ngFor="let p of [0,25,50,75,100]" class="tick"
                  [attr.x]="padding.left + (svgBars().innerW * p / 100)" [attr.y]="svgBars().height - 2" text-anchor="middle">{{ p }}%</text>
          </g>
        </svg>
      </div>

      <!-- Timeline list -->
      <div class="timeline" role="list">
        <div class="timeline-row" *ngFor="let it of intervals(); trackBy: trackByIdx" role="listitem">
          <span class="badge" [style.backgroundColor]="colorForState(it.state)" [attr.aria-label]="it.stateName"></span>
          <span class="state-name">{{ it.stateName }}</span>
          <span class="start">{{ it.start | date:'short' }}</span>
          <span class="end">{{ it.end | date:'short' }}</span>
          <span class="dur">{{ fmtDuration(it.durationMs) }}</span>
        </div>
      </div>
    }

    @if (error() && error() !== '404') {
      <div class="text-danger small mt-2">Errore: {{ error() }}</div>
    }
  </div>
</div>
